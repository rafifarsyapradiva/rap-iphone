<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rapTitaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#161617"/>
      <stop offset="100%" stop-color="#0E0E0F"/>
    </linearGradient>
    <linearGradient id="rapAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <filter id="rapShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple Squircle Container (r=26 on 108x108) -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#rapTitaniumGrad)" filter="url(#rapShadow)"/>
  <rect x="6" y="6" width="108" height="108" rx="26" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- Minimalist Dynamic Island Pill at Top -->
  <rect x="46" y="16" width="28" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Monogram R - Precision Architectural Geometry -->
  <!-- Stem -->
  <path d="M 40 34 L 40 86" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
  
  <!-- Loop -->
  <path d="M 40 34 H 59 C 71.5 34 79.5 41.5 79.5 51 C 79.5 60.5 71.5 68 59 68 H 40" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Diagonal Leg -->
  <path d="M 56 67 L 76.5 86" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Apple Retail Sapphire Signal Blue Lens Accent -->
  <circle cx="59.5" cy="51" r="4.5" fill="url(#rapAccentGrad)"/>
  <circle cx="60.5" cy="50" r="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>

